[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jira-forecasting"
version = "0.1.0"
description = "Monte Carlo forecasting tool for Jira"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
jira-forecast = "main:main"
